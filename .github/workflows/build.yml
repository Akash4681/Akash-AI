name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project.zip
        run: '[ -f project.zip ] && unzip -o project.zip || true'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: SAFE build (chat, voice, camera, memory, search)
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../safe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akash-natasha-SAFE
          path: safe.apk
      - name: FULL build (adds phone control and SMS)
        id: full
        continue-on-error: true
        run: |
          D=android/app/src/main/java/com/akashnatasha/app
          cp native/*.java $D/
          mkdir -p android/app/src/main/res/xml
          cp native/accessibility_service_config.xml android/app/src/main/res/xml/
          cp native/a11y.xml android/app/src/main/res/values/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name=".PhoneControlService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/></service></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.SEND_SMS"/><queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries></manifest>#' $M
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../full.apk
      - if: steps.full.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: akash-natasha-FULL
          path: full.apk
