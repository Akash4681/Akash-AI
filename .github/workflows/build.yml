name: Build AKASH AI + NATASHA AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-full-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Install Phone Control native sources
        shell: bash
        run: |
          set -euo pipefail
          D=android/app/src/main/java/com/akashnatasha/app
          test -d "$D"
          cp native/*.java "$D/"
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp native/accessibility_service_config.xml android/app/src/main/res/xml/
          cp native/a11y.xml android/app/src/main/res/values/a11y.xml
          python3 native/patch_manifest.py full

      - name: Verify full-build registration
        run: |
          grep -q 'PhoneControlPlugin.class' android/app/src/main/java/com/akashnatasha/app/MainActivity.java
          grep -q '\.PhoneControlService' android/app/src/main/AndroidManifest.xml
          grep -q 'accessibility_service_config' android/app/src/main/AndroidManifest.xml

      - name: Build full debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/akash-natasha-full.apk

      - name: Upload full APK
        uses: actions/upload-artifact@v7
        with:
          name: akash-natasha-full-apk
          path: dist/akash-natasha-full.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: akash-natasha-build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
