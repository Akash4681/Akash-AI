name: Build AKASH AI + NATASHA AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package.json && -f www/index.html && -f capacitor.config.json ]]; then
            echo "Project source already exists in repository root."
          else
            ZIP_FILE=""
            for f in project.zip AKASH_AI_NATASHA_UPDATED.zip AKASH_AI_NATASHA_INTERFACE_FIX.zip AKASH_AI_NATASHA_FINAL.zip akash-natasha.zip; do
              if [[ -f "$f" ]]; then ZIP_FILE="$f"; break; fi
            done

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No project ZIP found."
              find . -maxdepth 2 -type f
              exit 1
            fi

            mkdir -p .build-source

            python3 - "$ZIP_FILE" <<'PY'
          import sys, zipfile
          from pathlib import PurePosixPath

          with zipfile.ZipFile(sys.argv[1]) as z:
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'Unsafe path: {info.filename}')
                  z.extract(info, '.build-source')
          PY

            ROOT="$(find .build-source -type f -name package.json -not -path '*/node_modules/*' -print -quit | xargs -r dirname)"

            if [[ -z "$ROOT" ]]; then
              echo "ERROR: ZIP does not contain package.json."
              exit 1
            fi

            cp -a "$ROOT"/. .
          fi

          for f in package.json www/index.html capacitor.config.json native/MainActivity.java native/PhoneControlPlugin.java native/PhoneControlService.java native/patch_manifest.py; do
            if [[ ! -f "$f" ]]; then
              echo "ERROR: Required file missing: $f"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run project tests
        run: npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Install phone-control native files
        shell: bash
        run: |
          set -euo pipefail
          DEST="android/app/src/main/java/com/akashnatasha/app"
          test -d "$DEST"

          cp native/PhoneControlPlugin.java native/PhoneControlService.java native/MainActivity.java "$DEST/"

          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values

          cp native/accessibility_service_config.xml android/app/src/main/res/xml/
          cp native/a11y.xml android/app/src/main/res/values/a11y.xml

          python3 native/patch_manifest.py full

      - name: Verify native service registration
        run: |
          set -euo pipefail
          grep -q 'PhoneControlPlugin.class' android/app/src/main/java/com/akashnatasha/app/MainActivity.java
          grep -q '\.PhoneControlService' android/app/src/main/AndroidManifest.xml
          grep -q 'accessibility_service_config' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/akash-natasha-full.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: akash-natasha-full-apk
          path: dist/akash-natasha-full.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: akash-natasha-build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
