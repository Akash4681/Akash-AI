name: Build AKASH AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .source-unpack

          if [ -f package.json ]; then
            echo "Project files already exist."
          else
            ZIP=""

            for f in \
              AKASH_AI_NATASHA_UPDATED.zip \
              AKASH_AI_NATASHA_FINAL.zip \
              AKASH_AI_v4_Combined.zip \
              project.zip \
              akash-natasha.zip
            do
              if [ -f "$f" ]; then
                ZIP="$f"
                break
              fi
            done

            if [ -z "$ZIP" ]; then
              ZIP="$(find . -maxdepth 1 -type f \
                -iname '*.zip' -print -quit)"
            fi

            if [ -z "$ZIP" ]; then
              echo "ERROR: Project ZIP not found."
              exit 1
            fi

            echo "Extracting: $ZIP"
            python3 - "$ZIP" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          with zipfile.ZipFile(sys.argv[1]) as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe ZIP path: " + item.filename)
              z.extractall(".source-unpack")
          PY

            ROOT="$(find .source-unpack \
              -name package.json -type f \
              -not -path '*/node_modules/*' \
              -print -quit | xargs -r dirname)"

            if [ -z "$ROOT" ]; then
              echo "ERROR: package.json was not found inside the ZIP."
              echo "ZIP contents:"
              find .source-unpack -maxdepth 4 -type f | head -100
              exit 1
            fi

            echo "Project directory: $ROOT"
            cp -a "$ROOT"/. .
          fi

          test -f package.json
          test -f www/index.html
          test -f capacitor.config.json

          echo "Project files located successfully."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run available tests
        run: npm run test --if-present

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

            - name: Install native source files
          shell: bash
          run: |
          set -euo pipefail

          DEST="android/app/src/main/java/com/akashnatasha/app"
          RES="android/app/src/main/res"

          mkdir -p "$DEST" "$RES/xml" "$RES/values"

          if [ -d native ]; then
            find native -maxdepth 1 -name '*.java' \
              -exec cp {} "$DEST/" \;
          fi

          cat > "$RES/values/a11y_strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="a11y_label">AKASH AI Accessibility Service</string>
          </resources>
          EOF

          cat > "$RES/xml/accessibility_service_config.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false" />
          EOF

          if [ -f native/patch_manifest.py ]; then
            python3 native/patch_manifest.py full
          fi
